<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOTESTACK</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- Sidebar -->
        <aside class="sidebar">
            <div>
                <h2>📝 NoteStack</h2>
                <ul>
                    <li class="active" id="navNotes">📝 All Notes</li>
                    <li id="navImportant">🔴 Important</li>
                    <li id="navWork">🟡 Work</li>
                    <li id="navPersonal">🔵 Personal</li>
                    <li id="navIdeas">🟢 Ideas</li>
                    <li id="navTrash">🗑️ Trash</li>
                </ul>
                <div class="custom-folders-section">
                    <ul id="customFoldersList">
                        <!-- Dynamic folders will be injected here -->
                    </ul>
                    <button id="newFolderBtn" class="sidebar-btn">➕ New Folder</button>
                </div>
            </div>
            <button id="darkModeBtn">🌙 Dark Mode</button>
        </aside>

        <!-- Main Section -->
        <main class="main">

            <header class="topbar">
                <div class="filter-bar">
                    <div class="search-field">
                        <label for="searchInput" class="sr-only">Search notes</label>
                        <input type="search" id="searchInput" placeholder="Search notes..." autocomplete="off">
                    </div>
                    <div class="subject-filter">
                        <label for="subjectFilter">Subject</label>
                        <select id="subjectFilter">
                            <option value="all">All subjects</option>
                        </select>
                    </div>
                    <button id="clearFiltersBtn" type="button" hidden>Clear filters</button>
                </div>
                <p id="resultsInfo" class="results-info" aria-live="polite"></p>
            </header>

            <!-- NOTES VIEW -->
            <div id="notesView">
                <section class="create-note">
                    <textarea id="noteInput" placeholder="Take a note..."></textarea>
                    <!-- Subject Section -->
                    <div class="subject-input-row">
                        <label for="subjectInput">Subject</label>
                        <input type="text" id="subjectInput" list="subjectOptions" placeholder="e.g., DBMS" autocomplete="off" maxlength="60">
                        <datalist id="subjectOptions">
                            <!-- Subjects are derived from saved notes -->
                        </datalist>
                    </div>
                    <!-- Color Labels Section -->
                    <div class="label-selector">
                        <span class="label-title">Labels:</span>
                        <div class="label-options">
                            <label class="label-option">
                                <input type="checkbox" class="label-checkbox" value="Important">
                                <span class="label-dot important"></span> Important
                            </label>
                            <label class="label-option">
                                <input type="checkbox" class="label-checkbox" value="Work">
                                <span class="label-dot work"></span> Work
                            </label>
                            <label class="label-option">
                                <input type="checkbox" class="label-checkbox" value="Personal">
                                <span class="label-dot personal"></span> Personal
                            </label>
                            <label class="label-option">
                                <input type="checkbox" class="label-checkbox" value="Ideas">
                                <span class="label-dot ideas"></span> Ideas
                            </label>
                        </div>
                    </div>
                    <!-- Folder Selection -->
                    <div class="folder-selector">
                        <select id="folderSelect" aria-label="Folder">
                            <option value="">No Folder</option>
                            <!-- Dynamic folders injected here -->
                        </select>
                    </div>
                    <button id="addNoteBtn">Add Note</button>
                </section>
                <section id="notesGrid" class="notes-grid"></section>
            </div>

            <!-- TRASH VIEW (hidden by default) -->
            <div id="trashView" style="display:none;">
                <section id="trashGrid" class="notes-grid"></section>
            </div>

        </main>

    </div>

    <!-- New Folder Modal -->
    <div id="newFolderModal" class="modal" style="display:none;">
        <div class="modal-content">
            <span class="close-button" id="closeFolderModal">&times;</span>
            <h2>Create Folder</h2>
            <input type="text" id="folderNameInput" placeholder="Folder Name (e.g., College, Work)">
            <button id="createFolderBtn">Create</button>
        </div>
    </div>

    <!-- Edit Note Modal -->
    <div id="editNoteModal" class="modal" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="editNoteTitle">
        <div class="modal-content">
            <span class="close-button" id="closeEditModal">&times;</span>
            <h2 id="editNoteTitle">Edit Note</h2>
            <label for="editNoteInput">Note</label>
            <textarea id="editNoteInput" rows="5"></textarea>
            <label for="editSubjectInput">Subject</label>
            <input type="text" id="editSubjectInput" list="subjectOptions" placeholder="e.g., DBMS" autocomplete="off" maxlength="60">
            <p id="editNoteError" class="form-error" role="alert" hidden>Note text cannot be empty.</p>
            <div class="modal-actions">
                <button id="saveEditBtn" type="button">Save</button>
                <button id="cancelEditBtn" class="secondary-btn" type="button">Cancel</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
